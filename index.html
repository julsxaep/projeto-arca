<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto ARCA - Adoção</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header>
        <div class="logo">Projeto ARCA</div>

        <nav>
            <ul>
                <li><a href="#">Agende sua Consulta</a></li>
                <li><a href="adocao.html">Adoção</a></li>
                <li><a href="#">Denúncia</a></li>
                <li><a href="#">Solicitações</a></li>
                <li><a href="#">Saiba Mais</a></li>
                <li>
                    <div class="perfil">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <main class="animal-container">

        <section class="animal-card">

            <div class="animal-foto" onclick="document.getElementById('upload-foto').click();" title="Clique para alterar a foto">
                <input type="file" id="upload-foto" accept="image/*" style="display: none;">
                <img id="foto-preview" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Clique para adicionar uma foto">
            </div>

            <div class="animal-info">
                <div class="form-group">
                    <label>Nome:</label>
                    <input type="text" value="Thor">
                </div>

                <div class="form-group">
                    <label>Gênero:</label>
                    <input type="text" value="Macho">
                </div>

                <div class="form-group">
                    <label>Idade:</label>
                    <input type="text" value="3 anos">
                </div>

                <div class="form-group">
                    <label>Necessidade especial:</label>
                    <input type="text" value="Não possui">
                </div>

                <div class="form-group">
                    <label>Porte:</label>
                    <input type="text" value="Médio">
                </div>
            </div>

            <div class="animal-descricao">
                <label class="desc-title">Descrição:</label>
                <textarea rows="4">Thor é um cachorro muito dócil, brincalhão e sociável. Procura uma família que possa oferecer carinho, atenção e um lar cheio de amor.</textarea>
            </div>

            <div class="adotar-btn">
                <button class="btn-adotar">
                    Desejo adotar
                </button>
            </div>

        </section>

    </main>

    <footer>
        <p>
            &copy; SEICIT/SUBTI - Subsecretaria de Tecnologia da Informação<br>
            Rua Maestro Antônio Cícero, 111, Caçaroca, Prefeitura, Serra/ES, CEP 29176-11
        </p>
    </footer>

    <script>
        document.getElementById('upload-foto').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('foto-preview');
                    preview.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });
    </script>

</body>
</html>
